name: Pipeline Archive

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        type: choice
        options:
          - quick
          - full
        required: true
        default: quick
      skip_cache:
        description: Skip cache
        type: boolean
        required: false
        default: false

env:
  APP_NAME: react-app

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app

    outputs:
      build_ran: ${{ steps.build_check.outputs.build_ran }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Cache node_modules
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_cache == false }}
        uses: actions/cache@v4
        id: cache
        with:
          path: react-app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('react-app/package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: react-app/coverage
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}

      - name: Decide if build should run
        id: build_check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "build_ran=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_mode }}" == "full" ]]; then
            echo "build_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        if: ${{ steps.build_check.outputs.build_ran == 'true' }}
        run: npm run build

      - name: Skip build for quick PR
        if: ${{ steps.build_check.outputs.build_ran != 'true' }}
        run: echo "Build skipped: quick run; no build was required."

      - name: Upload build artifact
        if: ${{ steps.build_check.outputs.build_ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: react-app/build
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}

      - name: Print workflow summary
        shell: bash
        run: |
          build_mode="${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'n/a — push' }}"
          cache_used="${{ steps.cache.outputs.cache-hit == 'true' && 'yes' || 'no' }}"
          echo "${{ format('App: {0} | Build mode: {1} | Cache used: {2}', env.APP_NAME, build_mode, cache_used) }}"

  verify-archive:
    name: Verify archive
    needs: test-build
    if: ${{ always() && needs.test-build.result != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: coverage-artifacts

      - name: Download build artifact
        if: ${{ needs.test-build.outputs.build_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: build-artifacts

      - name: Show archive tree
        shell: bash
        run: |
          echo "Coverage tree:"
          tree -L 2 coverage-artifacts || true
          if [ -d build-artifacts ]; then
            echo "Build tree:"
            tree -L 2 build-artifacts || true
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Write archive manifest
        shell: bash
        run: |
          build_present="${{ needs.test-build.outputs.build_ran == 'true' && 'true' || 'false' }}"
          jq -n \
            --arg app_name "${{ env.APP_NAME }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg retention_days "${{ vars.ARTIFACT_RETENTION_DAYS }}" \
            --argjson build_artifact_present "$build_present" \
            '{app_name:$app_name, run_number:$run_number, retention_days:$retention_days, build_artifact_present:$build_artifact_present}' > archive-manifest.json

      - name: Read one value back with jq
        run: jq '.app_name' archive-manifest.json

      - name: Finish
        run: echo "Archive verified"
