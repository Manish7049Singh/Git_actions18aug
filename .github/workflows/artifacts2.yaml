name: Pipeline Archive

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        type: choice
        options:
          - quick
          - full
        required: true
        default: quick

      skip_cache:
        description: Skip cache
        type: boolean
        required: false
        default: false

env:
  APP_NAME: react-app
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  test-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    outputs:
      build_ran: ${{ steps.build_check.outputs.build_ran }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests with Coverage
        run: npm run test -- --coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: react-app/coverage
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Decide If Build Should Run
        id: build_check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "build_ran=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_mode }}" == "full" ]]; then
            echo "build_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Application
        if: ${{ steps.build_check.outputs.build_ran == 'true' }}
        run: npm run build

      - name: Skip Build
        if: ${{ steps.build_check.outputs.build_ran != 'true' }}
        run: echo "Build skipped (quick mode or PR run)."

      - name: Upload Build Artifact
        if: ${{ steps.build_check.outputs.build_ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: react-app/build
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Show Cache Information
        run: |
          echo "Node package cache is managed automatically by setup-node."

      - name: Print Workflow Summary
        run: |
          echo "=================================="
          echo "Application : ${{ env.APP_NAME }}"
          echo "Event       : ${{ github.event_name }}"
          echo "Build Ran   : ${{ steps.build_check.outputs.build_ran }}"
          echo "Run Number  : ${{ github.run_number }}"
          echo "=================================="

  verify-archive:
    name: Verify Archive

    needs: test-build

    if: ${{ always() && needs.test-build.result != 'cancelled' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: coverage-artifacts

      - name: Download Build Artifact
        if: ${{ needs.test-build.outputs.build_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: build-artifacts

      - name: Show Artifact Structure
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

          echo "===== Coverage Artifact ====="
          tree coverage-artifacts || true

          if [ -d build-artifacts ]; then
            echo "===== Build Artifact ====="
            tree build-artifacts || true
          fi

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate Artifact Manifest
        run: |
          jq -n \
            --arg app_name "${{ env.APP_NAME }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg build_ran "${{ needs.test-build.outputs.build_ran }}" \
            '{
              app_name: $app_name,
              run_number: $run_number,
              build_ran: $build_ran
            }' > archive-manifest.json

      - name: Read Manifest
        run: |
          cat archive-manifest.json
          jq '.app_name' archive-manifest.json

      - name: Finish
        run: echo "Archive verification completed successfully."